name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install System Dependencies
        # We need these libraries so our static SDL2 build can link against system drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        # Enable Testing Mode
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build Project
        run: cmake --build build --parallel $(nproc)

      - name: Run Unit Tests
        # This runs the logic tests we wrote earlier
        run: ./build/run_tests

  static-analysis:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run Analysis
        # Checks src/ and include/ for bugs, enforcing C89 standard where possible
        run: |
          cppcheck --error-exitcode=1 \
                   --language=c \
                   --std=c89 \
                   --enable=warning,performance,portability \
                   --suppress=missingIncludeSystem \
                   src/ include/
