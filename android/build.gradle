buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // [UPDATED] Use AGP 8.2.2 which supports Gradle 8.5 and Java 21
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}