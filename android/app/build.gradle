// android/app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    // Namespace is required for AGP 7.x+
    namespace 'com.myorg.game2048' 
    compileSdk 33

    defaultConfig {
        applicationId "com.myorg.game2048"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // Pass arguments to CMake if necessary (e.g., ensuring standard C89)
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Point to your existing project root CMakeLists.txt
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}